name: Tauri Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "App version (e.g. 2.0.0)"
        required: true
        default: "2.0.0"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('app-tauri/Cargo.lock') }}

      - name: Install frontend deps
        run: npm ci

      - name: Build app (NSIS .exe + WiX .msi)
        run: npm run tauri build

      - name: Create portable ZIP
        shell: pwsh
        run: |
          # Cargo workspace puts target/ at app-tauri/target (not src-tauri/target).
          $release = Join-Path (Get-Location) "target/release"
          if (-not (Test-Path $release)) { throw "release dir not found: $release" }
          $exe = Get-ChildItem -Path $release -Filter "RiotAccountManager.exe" |
            Where-Object { $_.FullName -notmatch "deps" } | Select-Object -First 1
          if ($null -eq $exe) { throw "portable exe not found under $release" }
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item $exe.FullName portable/
          Compress-Archive -Path portable/* -DestinationPath "RiotAccountManager-portable.zip" -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RiotAccountManager-windows
          path: |
            app-tauri/target/release/bundle/nsis/*.exe
            app-tauri/target/release/bundle/msi/*.msi
            app-tauri/RiotAccountManager-portable.zip
          if-no-files-found: warn

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app-tauri/target/release/bundle/nsis/*.exe
            app-tauri/target/release/bundle/msi/*.msi
            app-tauri/RiotAccountManager-portable.zip
