name: Tauri Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "App version (e.g. 2.0.0)"
        required: true
        default: "2.0.0"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    # Required for softprops/action-gh-release to create Release + upload assets.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('app-tauri/Cargo.lock') }}

      - name: Install frontend deps
        run: npm ci

      - name: Build app (NSIS .exe + WiX .msi)
        run: npm run tauri build

      - name: Create portable ZIP
        shell: pwsh
        run: |
          # Cargo workspace: app-tauri/target/release/
          # Default cargo binary is riot-account-manager.exe; mainBinaryName renames to RiotAccountManager.exe.
          $release = Join-Path (Get-Location) "target/release"
          if (-not (Test-Path $release)) { throw "release dir not found: $release" }

          $candidates = @(
            "RiotAccountManager.exe",
            "riot-account-manager.exe"
          )
          $exe = $null
          foreach ($name in $candidates) {
            $path = Join-Path $release $name
            if (Test-Path $path) { $exe = Get-Item $path; break }
          }

          if ($null -eq $exe) {
            $exe = Get-ChildItem -Recurse -Path $release -Filter "*.exe" |
              Where-Object {
                $_.FullName -notmatch '\\deps\\' -and
                $_.Name -notmatch 'setup' -and
                $_.FullName -notmatch '\\bundle\\nsis\\' -and
                $_.FullName -notmatch '\\bundle\\msi\\'
              } |
              Select-Object -First 1
          }

          if ($null -eq $exe) {
            Write-Host "EXE files under $release :"
            Get-ChildItem -Recurse -Path $release -Filter "*.exe" | ForEach-Object { $_.FullName }
            throw "portable exe not found under $release"
          }

          Write-Host "Using portable exe: $($exe.FullName)"
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item $exe.FullName (Join-Path portable "RiotAccountManager.exe")
          Compress-Archive -Path portable/* -DestinationPath "RiotAccountManager-portable.zip" -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RiotAccountManager-windows
          path: |
            app-tauri/target/release/bundle/nsis/*.exe
            app-tauri/target/release/bundle/msi/*.msi
            app-tauri/RiotAccountManager-portable.zip
          if-no-files-found: warn

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Riot Account Manager ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            app-tauri/target/release/bundle/nsis/*.exe
            app-tauri/target/release/bundle/msi/*.msi
            app-tauri/RiotAccountManager-portable.zip
