name: Tauri Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "App version (e.g. 2.0.0)"
        required: true
        default: "2.0.0"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    # Required for softprops/action-gh-release to create Release + upload assets.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('app-tauri/Cargo.lock') }}

      - name: Install frontend deps
        run: npm ci

      - name: Build app (NSIS installer)
        shell: pwsh
        run: |
          # Retry on transient network errors (e.g. WebView2 CDN timeout on GitHub runners).
          $max = 3
          for ($i = 1; $i -le $max; $i++) {
            Write-Host "Build attempt $i/$max"
            npm run tauri build
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($i -lt $max) { Start-Sleep -Seconds 30 }
          }
          exit 1

      - name: Create portable ZIP (installer + huong dan)
        shell: pwsh
        run: |
          # Khuyen nghi nguoi dung chay *-setup.exe (co WebView2 bootstrapper).
          # Zip gom installer + huong dan — tranh phan phoi 1 file .exe tran co the thieu WebView2.
          $setup = Get-ChildItem -Path "target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if ($null -eq $setup) { throw "NSIS setup.exe not found" }

          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item $setup.FullName (Join-Path portable "RiotAccountManager-Setup.exe")
          @"
          HUONG DAN CAI DAT - Riot Account Manager
          ========================================

          1. Giai nen file ZIP nay
          2. Chay RiotAccountManager-Setup.exe
          3. Neu Windows SmartScreen canh bao:
             - Bam "More info" -> "Run anyway"
             (Ung dung chua ky code signing — binh thuong voi app moi)

          4. Sau khi cai, mo app tu Start Menu

          Loi khi chay? Xem log:
          %LOCALAPPDATA%\RiotAccountManager\startup.log

          Tai WebView2 (neu can): https://go.microsoft.com/fwlink/p/?LinkId=2124703
          "@ | Set-Content -Path (Join-Path portable "HUONG-DAN.txt") -Encoding UTF8
          Compress-Archive -Path portable/* -DestinationPath "RiotAccountManager-portable.zip" -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RiotAccountManager-windows
          path: |
            app-tauri/target/release/bundle/nsis/*.exe
            app-tauri/RiotAccountManager-portable.zip
          if-no-files-found: warn

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Riot Account Manager ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            app-tauri/target/release/bundle/nsis/*.exe
            app-tauri/RiotAccountManager-portable.zip
