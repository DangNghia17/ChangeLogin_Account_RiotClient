name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "App version (e.g. 2.0.0)"
        required: true
        default: "2.0.0"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($v)) {
            $v = "${{ github.ref_name }}" -replace '^v',''
          }
          if ([string]::IsNullOrWhiteSpace($v)) { $v = "2.0.0" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build portable + installer
        shell: pwsh
        run: |
          ./scripts/package.ps1 -AppVersion "${{ steps.ver.outputs.version }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RiotAccountManager-${{ steps.ver.outputs.version }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.msi
          if-no-files-found: warn

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.exe
            dist/*.msi
