about.title=About Application
about.showWelcome=Show Welcome Guide
about.close=Close
about.section1.title=Application Introduction
about.section1.content=Riot Account Manager is a tool to help manage and quickly login to multiple Riot Games accounts (League of Legends, VALORANT, etc.). The application helps you switch between accounts quickly and conveniently.
about.section2.title=What does it support?
about.section2.content=• Manage multiple Riot Games accounts in one place\n• Auto login - just select account and click button\n• Open and focus on Riot Client from the application\n• Display Riot Client status (running/not running)\n• Calculate accurate click position based on Riot Client window\n• Check Riot Client before login (ensure window is visible)\n• Securely store login information (AES-256 encryption)\n• Quickly switch accounts, save time
about.section3.title=Does it affect the game?
about.section3.content=NO. The application is completely safe:\n• Only uses standard Windows API (Robot, Process)\n• NO process hooking, NO DLL injection, NO memory interference\n• Fully compatible with Vanguard (Riot's anti-cheat)\n• Only simulates keyboard/mouse actions like a real user\n• Does not interfere with game client or game logic
about.section4.title=Will information be leaked?
about.section4.content=NO. Information is maximally protected:\n• AES-256 encryption for all sensitive data\n• Stored locally in %LOCALAPPDATA%\\RiotAccountManager\\\n• NO data sent to server, NO internet connection\n• Open source (MIT License) - you can check\n• Only you have access to data on your computer
about.section5.title=Benefits of using
about.section5.content=Compared to manual login:\n• Save time: From 30-60 seconds → 2-3 seconds\n• Accurate: No worries about wrong username/password\n• Convenient: Easy to manage multiple accounts\n• Safe: Encrypted and stored locally\n• Efficient: Automate the login process

