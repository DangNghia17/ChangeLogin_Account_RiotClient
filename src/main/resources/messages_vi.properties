about.title=Thông tin về ứng dụng
about.showWelcome=Hiển thị lại hướng dẫn
about.close=Đóng
about.section1.title=Giới thiệu ứng dụng
about.section1.content=Riot Account Manager là công cụ hỗ trợ quản lý và đăng nhập nhanh vào nhiều tài khoản Riot Games (League of Legends, VALORANT, etc.). Ứng dụng giúp bạn chuyển đổi giữa các tài khoản một cách nhanh chóng và tiện lợi.
about.section2.title=Hỗ trợ làm gì?
about.section2.content=• Quản lý nhiều tài khoản Riot Games trong một nơi\n• Đăng nhập tự động - chỉ cần chọn tài khoản và bấm nút\n• Mở và focus vào Riot Client từ ứng dụng\n• Hiển thị trạng thái Riot Client (đang chạy/chưa chạy)\n• Tính toán vị trí click chính xác dựa trên cửa sổ Riot Client\n• Kiểm tra Riot Client trước khi đăng nhập (đảm bảo cửa sổ đang hiển thị)\n• Lưu trữ an toàn thông tin đăng nhập (mã hóa AES-256)\n• Chuyển đổi tài khoản nhanh chóng, tiết kiệm thời gian
about.section3.title=Có ảnh hưởng đến game không?
about.section3.content=KHÔNG. Ứng dụng hoàn toàn an toàn:\n• Chỉ sử dụng Windows API chuẩn (Robot, Process)\n• KHÔNG hook process, KHÔNG inject DLL, KHÔNG can thiệp vào bộ nhớ\n• Hoàn toàn tương thích với Vanguard (anti-cheat của Riot)\n• Chỉ mô phỏng thao tác bàn phím/chuột như người dùng thực\n• Không can thiệp vào game client hay game logic
about.section4.title=Có bị lộ thông tin không?
about.section4.content=KHÔNG. Thông tin được bảo vệ tối đa:\n• Mã hóa AES-256 cho tất cả dữ liệu nhạy cảm\n• Lưu trữ cục bộ trong %LOCALAPPDATA%\\RiotAccountManager\\\n• KHÔNG gửi dữ liệu lên server, KHÔNG kết nối internet\n• Mã nguồn mở (MIT License) - bạn có thể kiểm tra\n• Chỉ bạn mới có quyền truy cập dữ liệu trên máy tính của mình
about.section5.title=Lợi ích khi sử dụng
about.section5.content=So với đăng nhập thủ công:\n• Tiết kiệm thời gian: Từ 30-60 giây → 2-3 giây\n• Chính xác: Không lo nhập sai username/password\n• Tiện lợi: Quản lý nhiều tài khoản dễ dàng\n• An toàn: Mã hóa và lưu trữ cục bộ\n• Hiệu quả: Tự động hóa quy trình đăng nhập

